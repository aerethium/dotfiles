cursor_trail 2
cursor_trail_decay 0.05 0.1
cursor_trail_start_threshold 2
confirm_os_window_close 0
# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
#
background_opacity 0.88
dynamic_background_opacity yes

enabled_layouts splits,stack

# top/bottom split (kitty calls this hsplit)
map ctrl+shift+minus launch --location=hsplit --cwd=current

# left/right split, in case you want it
map ctrl+shift+backslash launch --location=vsplit --cwd=current

# move between splits
map ctrl+shift+up    neighboring_window up
map ctrl+shift+down  neighboring_window down
map ctrl+shift+left  neighboring_window left
map ctrl+shift+right neighboring_window right

# close current split
map ctrl+shift+w close_window

map ctrl+shift+alt+up    resize_window taller
map ctrl+shift+alt+down  resize_window shorter
map ctrl+shift+alt+left  resize_window narrower
map ctrl+shift+alt+right resize_window wider
